[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdfine"
version = "0.6.0"
description = "Ergonomic abstractions on top of rdflib and pyld for working with RDF graphs and JSON-LD documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rdf", "rdflib", "json-ld", "pyld", "sparql", "semantic-web"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    "rdflib>=7.0",
    "pyld>=2.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "boltons>=23.0",
    "glom>=23.0",
    "validators>=0.22",
    "pyshacl>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# The package source lives in the same directory as this pyproject.toml,
# so we map the package name "rdfine" to "." rather than relying on
# auto-discovery (which expects a parent folder containing the package).
[tool.setuptools]
packages = ["rdfine"]
package-dir = { "rdfine" = "." }
