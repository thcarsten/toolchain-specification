#################################################################
# Inference rules — framework-neutral
#
# Rules that hold for any pipeline regardless of the framework it
# compiles to. Anything RDF-Connect-specific lives in
# rdfc_inference_rules.yaml and has to be loaded as well:
#
#     GraphReader(graph).infer(".../inference_rules.yaml") \
#                       .infer(".../rdfc_inference_rules.yaml")
#
# Loading only this file leaves `tcs:derivedReadsFrom` /
# `tcs:derivedWritesTo` underived, which makes
# `tcs:RdfcStepChannelWiringShape` pass vacuously rather than fail — so a
# caller that forgets the second file loses the topology cross-check
# without being told.
#################################################################

context:
  '' : http://example.org/example/
  tcs: https://w3id.org/toolchain# 
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns# 
  rdfs: http://www.w3.org/2000/01/rdf-schema# 
  dct: http://purl.org/dc/terms/
  mu: http://mu.semte.ch/vocabularies/core/
  nfo: http://www.semanticdesktop.org/ontologies/2007/03/22/nfo#
  sh: http://www.w3.org/ns/shacl#
  xsd:  http://www.w3.org/2001/XMLSchema# 
  sw: https://semantic.works/services/ 
  dcat: http://www.w3.org/ns/dcat# 
  ldio: http://example.org/example/ldio/ 
  rdfc: https://w3id.org/rdf-connect# 
  p-plan: http://purl.org/net/p-plan# 
  prov: http://www.w3.org/ns/prov# 
rules:
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
    where: |
      ?sub p-plan:isStepOfPlan ?obj .
      ?obj a tcs:PipelineDefinition .
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
      ?obj a tcs:Channel .
    where: |
      ?sub tcs:writesTo ?obj .
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
      ?obj a tcs:Channel .
    where: |
      ?sub tcs:readsFrom ?obj .
  - 
    construct: | 
      ?obj a tcs:Config .
    where: |
      ?sub p-plan:hasInputVar ?obj .
      ?sub a tcs:InstancePipelineComponent .
  - 
    construct: | 
      ?obj a tcs:Config .
    where: |
      ?sub tcs:config ?obj .
  # Removed: a rule typing every dcat:resource of a catalog as a
  # tcs:PipelineComponent. It never fired — it matched
  # `?sub a prov:specializationOfCatalog`, which is not a term (the
  # catalog is typed tcs:Catalog / dcat:Catalog) — and fixing the typo
  # would have been worse than deleting it. Being listed in a catalog
  # should not *make* something a component; tcs:CatalogShape asserts
  # that as a constraint, and inferring it instead would mask entries
  # whose definitions have gone missing. That masking is exactly what
  # let two dangling entries survive in catalog-core.ttl.
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DefaultConfig .
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DockerComposeConfig .
  -
    # Mirrors PipelineEnricher.synthesize_channels' "neither side wired"
    # case, so pre-compile SHACL shapes (LdioStepOrderingShape,
    # AcyclicGraphShape, ...) see the same channel graph the compiler
    # will build from p-plan:isPrecededBy. The "reuse one already-wired
    # side" cases are handled by the two rules below; deliberately not
    # replicated here is the compiler's ambiguity guard (>1 channel on
    # either side leaves the edge untouched) — that case already has no
    # channel to construct from, so these rules simply don't match it.
    construct: |
      ?successor tcs:readsFrom _:synthesizedChannel .
      ?predecessor tcs:writesTo _:synthesizedChannel .
    where: |
      ?successor p-plan:isPrecededBy ?predecessor .
      FILTER NOT EXISTS { ?successor tcs:readsFrom ?existingReader }
      FILTER NOT EXISTS { ?predecessor tcs:writesTo ?existingWriter }
  -
    # Predecessor already has a single explicit tcs:writesTo — reuse it.
    construct: |
      ?successor tcs:readsFrom ?w .
    where: |
      ?successor p-plan:isPrecededBy ?predecessor .
      ?predecessor tcs:writesTo ?w .
      FILTER NOT EXISTS { ?successor tcs:readsFrom ?existingReader }
      FILTER NOT EXISTS {
        ?predecessor tcs:writesTo ?otherW .
        FILTER (?otherW != ?w)
      }
  -
    # Successor already has a single explicit tcs:readsFrom — reuse it.
    construct: |
      ?predecessor tcs:writesTo ?r .
    where: |
      ?successor p-plan:isPrecededBy ?predecessor .
      ?successor tcs:readsFrom ?r .
      FILTER NOT EXISTS { ?predecessor tcs:writesTo ?existingWriter }
      FILTER NOT EXISTS {
        ?successor tcs:readsFrom ?otherR .
        FILTER (?otherR != ?r)
      }
  -
    # Channel-type propagation: a channel written to by a step whose
    # component is a tcs:EntryBoundaryComponent inherits that boundary's
    # tcs:channelType. Lets pre-compile SHACL shapes see the channel type
    # BridgeTransportCompiler will otherwise mint at compile time.
    construct: |
      ?ch a ?channelType .
    where: |
      ?step tcs:writesTo ?ch ;
            prov:specializationOf ?comp .
      ?comp a tcs:EntryBoundaryComponent ;
            tcs:channelType ?channelType .
  -
    # Symmetric case for tcs:ExitBoundaryComponent reading from a channel.
    construct: |
      ?ch a ?channelType .
    where: |
      ?step tcs:readsFrom ?ch ;
            prov:specializationOf ?comp .
      ?comp a tcs:ExitBoundaryComponent ;
            tcs:channelType ?channelType .
