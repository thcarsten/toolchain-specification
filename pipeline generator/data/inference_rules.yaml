context:
  '' : http://example.org/example/ 
  tc: https://w3id.org/toolchain# 
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns# 
  rdfs: http://www.w3.org/2000/01/rdf-schema# 
  osw: http://ontosoft.org/software# 
  dct: http://purl.org/dc/terms/
  ext: http://mu.semte.ch/vocabluries/ext/
  mu: http://mu.semte.ch/vocabularies/core/
  nfo: http://www.semanticdesktop.org/ontologies/2007/03/22/nfo#
  nie: http://www.semanticdesktop.org/ontologies/2007/01/19/nie#
  sh: http://www.w3.org/ns/shacl#
  xsd:  http://www.w3.org/2001/XMLSchema# 
  sw: https://semantic.works/services/ 
  dcat: http://www.w3.org/ns/dcat# 
  ldio: http://example.org/example/ldio/ 
  rdfc: https://w3id.org/rdf-connect# 
  p-plan: http://purl.org/net/p-plan# 
  owl: http://www.w3.org/2002/07/owl# 
  prov: http://www.w3.org/ns/prov# 
rules:
  - 
    construct: | 
      ?sub a tc:PipelineStep .
    where: |
      ?sub p-plan:isStepOfPlan ?obj .
      ?obj a tc:PipelineDefinition .
  - 
    construct: | 
      ?obj a tc:PipelineStep .
    where: |
      ?sub p-plan:isPrecededBy ?obj .
      ?sub a tc:PipelineStep .
  - 
    construct: | 
      ?sub a tc:PipelineStep .
    where: |
      ?sub p-plan:isPrecededBy ?obj .
      ?obj a tc:PipelineStep .
  - 
    construct: | 
      ?obj a tc:Assignment .
    where: |
      ?sub p-plan:hasInputVar ?obj .
      ?sub a tc:PipelineStep .
  - 
    construct: | 
      ?sub a tc:Assignment .
    where: |
      ?sub p-plan:isVariableOfPlan ?obj .
      ?obj a tc:PipelineDefinition .
  - 
    construct: | 
      ?sub a tc:Assignment .
      ?obj a tc:PipelineComponent .
    where: |
      ?sub tc:component ?obj .
  - 
    construct: | 
      ?obj a tc:Assignment .
    where: |
      ?sub dct:requires ?obj .
      ?sub a tc:PipelineComponent .
  - 
    construct: | 
      ?sub a tc:PipelineComponent .
    where: |
      ?sub dct:requires ?obj .
      ?obj a tc:Assignment .
  - 
    construct: | 
      ?obj a tc:Config .
    where: |
      ?sub tc:config ?obj .
  - 
    construct: | 
      ?obj a tc:PipelineComponent .
    where: |
      ?sub dcat:resource ?obj .
      ?sub a tc:ComponentCatalog .
    