context:
  '' : http://example.org/example/ 
  tcs: https://w3id.org/toolchain# 
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns# 
  rdfs: http://www.w3.org/2000/01/rdf-schema# 
  dct: http://purl.org/dc/terms/
  mu: http://mu.semte.ch/vocabularies/core/
  nfo: http://www.semanticdesktop.org/ontologies/2007/03/22/nfo#
  sh: http://www.w3.org/ns/shacl#
  xsd:  http://www.w3.org/2001/XMLSchema# 
  sw: https://semantic.works/services/ 
  dcat: http://www.w3.org/ns/dcat# 
  ldio: http://example.org/example/ldio/ 
  rdfc: https://w3id.org/rdf-connect# 
  p-plan: http://purl.org/net/p-plan# 
  prov: http://www.w3.org/ns/prov# 
rules:
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
    where: |
      ?sub p-plan:isStepOfPlan ?obj .
      ?obj a tcs:PipelineDefinition .
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
      ?obj a tcs:Channel .
    where: |
      ?sub tcs:writesTo ?obj .
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
      ?obj a tcs:Channel .
    where: |
      ?sub tcs:readsFrom ?obj .
  - 
    construct: | 
      ?obj a tcs:Config .
    where: |
      ?sub p-plan:hasInputVar ?obj .
      ?sub a tcs:InstancePipelineComponent .
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
      ?obj a tcs:PipelineComponent .
    where: |
      ?sub prov:specializationOf ?obj .
  - 
    construct: | 
      ?obj a tcs:PipelineComponent .
    where: |
      ?sub dct:requires ?obj .
      ?sub a tcs:PipelineComponent .
  - 
    construct: | 
      ?sub a tcs:PipelineComponent .
    where: |
      ?sub dct:requires ?obj .
      ?obj a tcs:PipelineComponent .
  - 
    construct: | 
      ?obj a tcs:Config .
    where: |
      ?sub tcs:config ?obj .
  # Removed: a rule typing every dcat:resource of a catalog as a
  # tcs:PipelineComponent. It never fired — it matched
  # `?sub a prov:specializationOfCatalog`, which is not a term (the
  # catalog is typed tcs:Catalog / dcat:Catalog) — and fixing the typo
  # would have been worse than deleting it. Being listed in a catalog
  # should not *make* something a component; tcs:CatalogShape asserts
  # that as a constraint, and inferring it instead would mask entries
  # whose definitions have gone missing. That masking is exactly what
  # let two dangling entries survive in catalog-core.ttl.
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DefaultConfig .
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DockerComposeConfig .

  #################################################################
  # Pipeline topology
  #
  # A step's channel wiring is stated twice: framework-specifically
  # inside its `tcs:embedded` config (`rdfc:reader demo:x`), and
  # framework-neutrally as `tcs:readsFrom` / `tcs:writesTo`. Nothing
  # previously connected the two — compilers read the config, the
  # application-profile shapes read the annotation — so the pair could
  # disagree silently.
  #
  # These rules materialise what the config *implies*, into separate
  # `tcs:derived*` predicates. They deliberately do NOT write
  # `tcs:readsFrom` / `tcs:writesTo` directly: the authored annotation
  # stays the source of truth, and `tcs:StepChannelWiringShape` (in
  # catalog-application-profile-shapes.ttl) then asserts that everything
  # derived was also declared.
  #
  # Derivation is keyed on the generated config shapes: a property with
  # `sh:class tcs:Channel` is a channel parameter, and its
  # `tcs:upstreamClass` records which end of the channel it is. Both
  # conditions are required — `tcs:upstreamClass` alone also appears on
  # non-channel properties (e.g. `tm:path`, carrying rdfl:PathLens),
  # where it means "translated from that class" rather than a direction.
  #
  # Only RDF-Connect steps are covered, because only their components
  # carry channel-valued parameters. LDIO expresses topology through the
  # *ordering* of its input/adapter/transformer/output slots and has no
  # channel parameters at all, so nothing is derivable there and the
  # shape correctly leaves those steps alone.
  #################################################################
  -
    construct: |
      ?step tcs:derivedReadsFrom ?channel .
    where: |
      ?step prov:specializationOf ?component ;
            p-plan:hasInputVar/tcs:embedded ?config .
      ?component dcat:qualifiedRelation/dct:relation ?shape .
      ?shape sh:property ?property .
      ?property sh:path ?path ;
                sh:class tcs:Channel ;
                tcs:upstreamClass rdfc:Reader .
      ?config ?path ?channel .
  -
    construct: |
      ?step tcs:derivedWritesTo ?channel .
    where: |
      ?step prov:specializationOf ?component ;
            p-plan:hasInputVar/tcs:embedded ?config .
      ?component dcat:qualifiedRelation/dct:relation ?shape .
      ?shape sh:property ?property .
      ?property sh:path ?path ;
                sh:class tcs:Channel ;
                tcs:upstreamClass rdfc:Writer .
      ?config ?path ?channel .
