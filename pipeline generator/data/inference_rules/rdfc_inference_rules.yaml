#################################################################
# Inference rules — RDF-Connect only
#
# Split out of inference_rules.yaml, which keeps the framework-neutral
# rules. Every rule here selects on `rdfc:Processor` and derives facts
# that only mean anything for RDF-Connect; none of them should ever fire
# for an LDIO or a semantic.works step.
#
# Load it *alongside* the neutral rules, not instead of them:
#
#     GraphReader(graph).infer(".../inference_rules.yaml") \
#                       .infer(".../rdfc_inference_rules.yaml")
#
# Order does not matter. Nothing here depends on a triple the neutral
# rules derive: `rdfc:Processor` is stated in the catalog (by the
# emitter for generated components, by hand in catalog-rdfc-manual.ttl
# for the rest) precisely so that this file does not need an inference
# pass to have run before it.
#################################################################

context:
  tcs: https://w3id.org/toolchain#
  rdfc: https://w3id.org/rdf-connect#
  sh: http://www.w3.org/ns/shacl#
  dcat: http://www.w3.org/ns/dcat#
  dct: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  p-plan: http://purl.org/net/p-plan#

rules:
  #################################################################
  # Pipeline topology
  #
  # A step's channel wiring is stated twice: framework-specifically
  # inside its `tcs:embedded` config (`rdfc:reader demo:x`), and
  # framework-neutrally as `tcs:readsFrom` / `tcs:writesTo`. Nothing
  # previously connected the two — compilers read the config, the
  # application-profile shapes read the annotation — so the pair could
  # disagree silently.
  #
  # These rules materialise what the config *implies*, into separate
  # `tcs:derived*` predicates. They deliberately do NOT write
  # `tcs:readsFrom` / `tcs:writesTo` directly: the authored annotation
  # stays the source of truth, and `tcs:RdfcStepChannelWiringShape` (in
  # catalog-application-profile-shapes.ttl) then asserts that everything
  # derived was also declared.
  #
  # Derivation is keyed on the generated config shapes: a property with
  # `sh:class tcs:Channel` is a channel parameter, and its
  # `tcs:upstreamClass` records which end of the channel it is. Both
  # conditions are required — `tcs:upstreamClass` alone also appears on
  # non-channel properties (e.g. `tm:path`, carrying rdfl:PathLens),
  # where it means "translated from that class" rather than a direction.
  #
  # `?component a rdfc:Processor` is what confines this to RDF-Connect.
  # It is not redundant with the shape conditions: `sh:class tcs:Channel`
  # plus `tcs:upstreamClass` are toolchain terms that another framework's
  # catalog could legitimately use once it grows channel-valued
  # parameters, and this rule pair only knows how to read RDF-Connect's
  # config layout. LDIO expresses topology through the *ordering* of its
  # input/adapter/transformer/output slots and has no channel parameters
  # at all, so nothing is derivable there either way.
  #################################################################
  -
    construct: |
      ?step tcs:derivedReadsFrom ?channel .
    where: |
      ?component a rdfc:Processor ;
                 dcat:qualifiedRelation/dct:relation ?shape .
      ?step prov:specializationOf ?component ;
            p-plan:hasInputVar/tcs:embedded ?config .
      ?shape sh:property ?property .
      ?property sh:path ?path ;
                sh:class tcs:Channel ;
                tcs:upstreamClass rdfc:Reader .
      ?config ?path ?channel .
  -
    construct: |
      ?step tcs:derivedWritesTo ?channel .
    where: |
      ?component a rdfc:Processor ;
                 dcat:qualifiedRelation/dct:relation ?shape .
      ?step prov:specializationOf ?component ;
            p-plan:hasInputVar/tcs:embedded ?config .
      ?shape sh:property ?property .
      ?property sh:path ?path ;
                sh:class tcs:Channel ;
                tcs:upstreamClass rdfc:Writer .
      ?config ?path ?channel .
