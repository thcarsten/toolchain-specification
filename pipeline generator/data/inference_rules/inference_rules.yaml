#################################################################
# Inference rules — framework-neutral
#
# Rules that hold for any pipeline regardless of the framework it
# compiles to. This is the only inference file now: RDF-Connect's
# `rdfc_inference_rules.yaml` (the `tcs:derivedReadsFrom`/
# `derivedWritesTo` pair feeding the since-deleted
# `tcs:RdfcStepChannelWiringShape`) went with `tcs:readsFrom` /
# `tcs:writesTo` themselves — `tcs:Connection` is the only wiring
# vocabulary now, nothing left to cross-check.
#################################################################

context:
  '' : http://example.org/example/
  tcs: https://w3id.org/toolchain# 
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns# 
  rdfs: http://www.w3.org/2000/01/rdf-schema# 
  dct: http://purl.org/dc/terms/
  mu: http://mu.semte.ch/vocabularies/core/
  nfo: http://www.semanticdesktop.org/ontologies/2007/03/22/nfo#
  sh: http://www.w3.org/ns/shacl#
  xsd:  http://www.w3.org/2001/XMLSchema# 
  sw: https://semantic.works/services/ 
  dcat: http://www.w3.org/ns/dcat# 
  ldio: http://example.org/example/ldio/ 
  rdfc: https://w3id.org/rdf-connect# 
  p-plan: http://purl.org/net/p-plan# 
  prov: http://www.w3.org/ns/prov# 
rules:
  - 
    construct: | 
      ?sub a tcs:InstancePipelineComponent .
    where: |
      ?sub p-plan:isStepOfPlan ?obj .
      ?obj a tcs:PipelineDefinition .
  -
    construct: |
      ?obj a tcs:Config .
    where: |
      ?sub p-plan:hasInputVar ?obj .
      ?sub a tcs:InstancePipelineComponent .
  - 
    construct: | 
      ?obj a tcs:Config .
    where: |
      ?sub tcs:config ?obj .
  # Removed: a rule typing every dcat:resource of a catalog as a
  # tcs:PipelineComponent. It never fired — it matched
  # `?sub a prov:specializationOfCatalog`, which is not a term (the
  # catalog is typed tcs:Catalog / dcat:Catalog) — and fixing the typo
  # would have been worse than deleting it. Being listed in a catalog
  # should not *make* something a component; tcs:CatalogShape asserts
  # that as a constraint, and inferring it instead would mask entries
  # whose definitions have gone missing. That masking is exactly what
  # let two dangling entries survive in catalog-core.ttl.
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DefaultConfig .
  -
    construct: |
      ?sub a tcs:Config .
    where: |
      ?sub a tcs:DockerComposeConfig .
  -
    # Channel-type propagation: a Connection whose tcs:from is a step
    # whose component is a tcs:EntryBoundaryComponent inherits that
    # boundary's tcs:channelType. Lets pre-compile SHACL shapes see the
    # channel type BridgeTransportCompiler will otherwise mint at
    # compile time.
    construct: |
      ?ch a ?channelType .
    where: |
      ?ch tcs:from ?step .
      ?step prov:specializationOf ?comp .
      ?comp a tcs:EntryBoundaryComponent ;
            tcs:channelType ?channelType .
  -
    # Symmetric case for tcs:ExitBoundaryComponent on the tcs:to side.
    construct: |
      ?ch a ?channelType .
    where: |
      ?ch tcs:to ?step .
      ?step prov:specializationOf ?comp .
      ?comp a tcs:ExitBoundaryComponent ;
            tcs:channelType ?channelType .
