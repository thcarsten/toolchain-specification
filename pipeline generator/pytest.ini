[pytest]
; Run from `pipeline generator/` (this file's directory): `pytest`.
; Makes `src/` importable without installing `compilers` as a package.
; Scoped to the compilers/generator suite only — rdfine has its own
; pytest config in src/rdfine/pyproject.toml, run separately from
; src/rdfine/ since it's an independently installable package.
pythonpath = src
testpaths = tests
