name: LDIO Example Pipeline
description: A simple example pipeline using two processors and one runner of the
  LDIO framework for the pipeline generator PoC.
input:
  name: Ldio:LdesClient
  config:
    retries:
      enabled: true
    urls: https://ca-westtoerwin-nginx-prod.livelyisland-1fa58ea1.westeurope.azurecontainerapps.io/touristattractions/latestView
transformers:
- name: Ldio:SparqlConstructTransformer
  config:
    query: |
      CONSTRUCT {
              ?s ?p ?o
      }
      WHERE { ?s ?p ?o }
outputs:
- name: Ldio:ConsoleOut
  config:
    rdf-writer:
      content-type: text/turtle
